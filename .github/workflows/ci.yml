name: CI

on:
  push:
    branches: [main]
    # v で始まるタグ（例: v0.1.0）を push すると、配布用の Release も作る（release ジョブ）
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.6.3"

jobs:
  checks:
    name: format / lint / static / test / build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # タグ（v*）のときは、まずタグのコミットのプリセットがタグと同じ版かを見る（set で書き換える前）。
      # 版を上げる PR のマージ前に Release を作ると、タグが古い版のコミットを指す（v0.3.1 で起きた）。
      # 違えば、タグとプリセットの版と直し方を、注釈とジョブのまとめに日本語で出して止める。
      - name: Check the tag against the presets (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 tools/release_version.py verify-tag "$GITHUB_REF_NAME" --github

      # タグ（v*）のときは、30 分の書き出しと公証を待たずに、Mac の署名に要る Secrets がそろっているかを最初に見る。
      # 値は表示しない（名前だけ）。タグ以外（main・PR・手動）は、これまでどおり署名と公証を飛ばす。
      - name: Check macOS signing secrets (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          MACOS_DEVELOPER_ID_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_P8: ${{ secrets.ASC_P8 }}
        run: |
          missing=()
          for name in MACOS_DEVELOPER_ID_P12_BASE64 MACOS_DEVELOPER_ID_PASSWORD ASC_KEY_ID ASC_ISSUER_ID ASC_P8; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=Mac の署名の Secrets が足りません::タグ ${GITHUB_REF_NAME} の Release には署名と公証を済ませた Mac 版が要ります。未登録: ${missing[*]}（登録の仕方は docs/macos-signing.md）"
            exit 1
          fi
          echo "Mac の署名と公証に要る Secrets は 5 つともあります"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install gdtoolkit
        run: pip install -r requirements-dev.txt

      - name: Cache Godot and export templates
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-${{ env.GODOT_VERSION }}-${{ hashFiles('tools/install_godot.sh') }}

      - name: Install Godot (checksum verified)
        run: tools/install_godot.sh "$HOME/godot"

      # タグのときは、書き出しの前にアプリの版をタグから入れる（v0.2.1 → Mac 0.2.1・Windows 0.2.1.0）。
      # check.sh は RELEASE_TAG があると、プリセットと書き出した exe・.app の版がタグと同じかも確かめる。
      - name: Set app version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 tools/release_version.py set "$GITHUB_REF_NAME"

      # テストは 4 つの Godot で並列に流す（GitHub のランナーは 4 コア。組ごとのログは build/logs/test_shard_<i>.log）
      - name: Run quality gate and Windows / macOS / Linux export
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: GODOT="$HOME/godot/godot" tools/check.sh --build --jobs=4

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: godot-logs
          path: build/logs
          if-no-files-found: ignore

      - name: Upload Windows build
        uses: actions/upload-artifact@v5
        with:
          name: rule-relay-windows
          path: build/windows
          retention-days: 14

      - name: Upload macOS build
        uses: actions/upload-artifact@v5
        with:
          name: rule-relay-macos
          path: build/macos
          retention-days: 14

      - name: Upload submission ZIPs (Windows / macOS / Linux, with LICENSES.txt)
        uses: actions/upload-artifact@v5
        with:
          name: rule-relay-submission
          path: build/submission
          retention-days: 14

      - name: Upload Linux build (Steam Deck)
        uses: actions/upload-artifact@v5
        with:
          name: rule-relay-linux
          path: build/linux
          retention-days: 14

  windows-smoke:
    name: Windows launch smoke test
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: rule-relay-windows
          path: build

      - name: Launch exported exe headless
        shell: pwsh
        run: |
          $log = Join-Path $PWD "smoke.log"
          $p = Start-Process -FilePath "build/rule-relay.exe" `
            -ArgumentList @("--headless", "--quit-after", "300", "--log-file", $log) `
            -Wait -PassThru
          if (Test-Path $log) { Get-Content $log }
          if ($p.ExitCode -ne 0) { throw "exit code $($p.ExitCode)" }
          if ((Test-Path $log) -and (Select-String -Path $log -Pattern '^(SCRIPT )?ERROR:' -Quiet)) {
            throw "errors in log"
          }

  macos-smoke:
    name: macOS launch smoke test
    needs: checks
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: rule-relay-macos
          path: build

      - name: Launch exported app headless (solo)
        run: |
          cd build
          unzip -q rule-relay.zip
          app="$(ls -d *.app | head -n 1)"
          bin="$app/Contents/MacOS/$(ls "$app/Contents/MacOS" | head -n 1)"
          log="$PWD/smoke.log"
          "$bin" --headless --quit-after 300 --log-file "$log" -- --solo --profile=ci_smoke
          cat "$log"
          if grep -E '^(SCRIPT )?ERROR:' "$log"; then
            echo "errors in log"
            exit 1
          fi


  # Mac 版を Developer ID で署名し、Apple の公証に通す（初回起動の「開発元を確認できません」をなくす）。
  # main と手動実行では、Secrets が登録されるまでは何もせずに通る。PR では動かさない。
  # タグ（v*）では Secrets が無いと通さない（checks ジョブの最初の段で、足りない名前を出して止める）。
  # 必要な Secrets（docs/macos-signing.md）:
  #   MACOS_DEVELOPER_ID_P12_BASE64 / MACOS_DEVELOPER_ID_PASSWORD: Developer ID Application 証明書（秘密鍵つき .p12）
  #   ASC_KEY_ID / ASC_ISSUER_ID / ASC_P8: App Store Connect の API キー（公証に使う）
  macos-notarize:
    name: macOS sign and notarize (Developer ID)
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      HAS_SIGNING: >-
        ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 != '' && secrets.MACOS_DEVELOPER_ID_PASSWORD != ''
        && secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.ASC_P8 != '' }}
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Signing secrets are not set yet
        if: env.HAS_SIGNING != 'true'
        run: |
          if [ "$IS_TAG" = "true" ]; then
            echo "::error::タグの Release には署名と公証が要りますが、Secrets が足りません（docs/macos-signing.md）"
            exit 1
          fi
          echo "::notice::署名用の Secrets が未登録なので、署名と公証を飛ばしました（docs/macos-signing.md）"

      - uses: actions/download-artifact@v5
        if: env.HAS_SIGNING == 'true'
        with:
          name: rule-relay-macos
          path: build

      - name: Import Developer ID certificate
        if: env.HAS_SIGNING == 'true'
        env:
          P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          kc_password="$(uuidgen)"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kc_password" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kc_password" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$P12_PASSWORD" -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_password" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          if ! security find-identity -v -p codesigning "$kc" | grep -q '"Developer ID Application'; then
            echo "::error::.p12 に Developer ID Application の証明書（秘密鍵つき）がありません。Apple Distribution / Apple Development では Mac 版を配れません"
            exit 1
          fi

      - name: Sign the app
        if: env.HAS_SIGNING == 'true'
        run: |
          cd build
          unzip -q rule-relay.zip
          app="$(ls -d *.app | head -n 1)"
          codesign --force --deep --options runtime --timestamp \
            --sign "Developer ID Application" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Notarize and staple
        if: env.HAS_SIGNING == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_P8: ${{ secrets.ASC_P8 }}
        run: |
          cd build
          app="$(ls -d *.app | head -n 1)"
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$ASC_P8" > "$key"
          ditto -c -k --keepParent "$app" notarize.zip
          xcrun notarytool submit notarize.zip --key "$key" --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" --wait --timeout 30m
          rm -f "$key" notarize.zip
          xcrun stapler staple "$app"
          spctl --assess --type execute --verbose=2 "$app"
          mkdir -p ../signed
          ditto -c -k --keepParent "$app" ../signed/rule-relay-macos.zip

      - name: Upload signed macOS build
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: rule-relay-macos-signed
          path: signed
          retention-days: 30

      - name: Remove the signing keychain
        if: always() && env.HAS_SIGNING == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  # タグ（v*）を push したときだけ: Windows 版・署名と公証済みの Mac 版・Linux 版（Steam Deck）を Release に並べる。
  # ZIP は提出用と同じ tools/check_submission.py で作って確かめる（LICENSES.txt の同梱・秘密や原本が無い・Steam が無い・
  # Mac の .app に署名と公証の票がある・exe と .app の版がタグと同じ）。Mac 版は macos-notarize ジョブの ZIP を使う。
  release:
    name: GitHub Release (tag)
    needs: [checks, windows-smoke, macos-smoke, macos-notarize]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: rule-relay-windows
          path: dist/windows

      - uses: actions/download-artifact@v5
        with:
          name: rule-relay-macos-signed
          path: dist/macos

      - uses: actions/download-artifact@v5
        with:
          name: rule-relay-linux
          path: dist/linux

      - name: Package and check the release ZIPs (with LICENSES.txt)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 tools/check_submission.py --release-tag "$TAG" \
            --windows-exe dist/windows/rule-relay.exe \
            --macos-zip dist/macos/rule-relay-macos.zip \
            --linux-bin dist/linux/rule-relay.x86_64 \
            --out-dir release --require-notarized
          ls -la release

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          files=("release/rule-relay-${TAG}-windows.zip" "release/rule-relay-${TAG}-macos.zip" "release/rule-relay-${TAG}-linux.zip")
          # 版ごとのリリースノート（docs/release-notes/<タグ>.md）があれば、自動の変更一覧の前に置く
          notes=()
          if [ -f "docs/release-notes/${TAG}.md" ]; then
            notes=(--notes-file "docs/release-notes/${TAG}.md")
          fi
          # GitHub の画面で Release を先に作った場合は、そこへ ZIP を足す。
          # 説明文が空なら docs/release-notes/<タグ>.md で埋める。手で書いた説明文は書き換えず、
          # ノートと違えば貼り方を警告で出す（本人の意図した編集を消さない。tools/release_version.py release-body）。
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/release-body.md"
            python3 tools/release_version.py release-body "$TAG" --github \
              --body-file "$RUNNER_TEMP/release-body.md" --action-file "$RUNNER_TEMP/release-body-action"
            if [ "$(cat "$RUNNER_TEMP/release-body-action")" = "fill" ]; then
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "docs/release-notes/${TAG}.md"
            fi
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "rule-relay $TAG" \
              --generate-notes "${notes[@]}" "${files[@]}"
          fi
