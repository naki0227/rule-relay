name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.6.3"

jobs:
  checks:
    name: format / lint / static / test / build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install gdtoolkit
        run: pip install -r requirements-dev.txt

      - name: Cache Godot and export templates
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-${{ env.GODOT_VERSION }}-${{ hashFiles('tools/install_godot.sh') }}

      - name: Install Godot (checksum verified)
        run: tools/install_godot.sh "$HOME/godot"

      - name: Run quality gate and Windows export
        run: GODOT="$HOME/godot/godot" tools/check.sh --build

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: godot-logs
          path: build/logs
          if-no-files-found: ignore

      - name: Upload Windows build
        uses: actions/upload-artifact@v5
        with:
          name: rule-relay-windows
          path: build/windows
          retention-days: 14

  windows-smoke:
    name: Windows launch smoke test
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: rule-relay-windows
          path: build

      - name: Launch exported exe headless
        shell: pwsh
        run: |
          $log = Join-Path $PWD "smoke.log"
          $p = Start-Process -FilePath "build/rule-relay.exe" `
            -ArgumentList @("--headless", "--quit-after", "300", "--log-file", $log) `
            -Wait -PassThru
          if (Test-Path $log) { Get-Content $log }
          if ($p.ExitCode -ne 0) { throw "exit code $($p.ExitCode)" }
          if ((Test-Path $log) -and (Select-String -Path $log -Pattern '^(SCRIPT )?ERROR:' -Quiet)) {
            throw "errors in log"
          }
